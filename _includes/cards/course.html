<div class="col col-md-6 col-lg-6">
  <div class="card border-warning">
    <img src="{{include.course.Image}}" class="card-img-top" alt="..." />
    <div class="card-body">
      <h5 class="card-title">{{include.course.Title}}</h5>
      <p class="card-text">{{include.course.Description}}</p>
    </div>
    <div class="card-footer course-card-footer">
      <div class="row">
        <a
          href="{{include.course.Link}}"
          class="btn btn-outline-warning btn-block"
          >Go To Course</a
        >
      </div>
    </div>
  </div>
</div>
